ShortDescription: Convert Apple Numbers spreadsheets to Excel, offline.
Description: |-
  Numbers Converter turns Apple Numbers (.numbers) files into Excel (.xlsx) workbooks on your PC, with no Mac and no upload.
  It keeps values, table styles, formatting, number formats, comments, links, form controls and filters, rewrites formulas as Excel formulas, recalculates pivot tables, and turns charts into real Excel charts.
  A preview shows each sheet as it will be in Excel, and before you save, the app lists anything that will come out differently.
